<!DOCTYPE html>
<html>
<head>
<title>Secure Chat</title>
<style>
body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
#status { font-weight: bold; padding: 5px; }
.unencrypted { background: #f8d7da; }
.encrypted { background: #d4edda; }
#log { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
</style>
</head>
<body>
<h2>SECURE CHAT</h2>
<label>Server IP: <input id="serverIp" value="127.0.0.1"></label><br><br>
<label>Name: <input id="username" value="Alice"></label><br><br>
<label>Mode:
<select id="mode">
<option value="unencrypted">UNENCRYPTED</option>
<option value="encrypted">ENCRYPTED</option>
</select>
</label>
<button id="connectBtn">Connect</button>
<div id="status" class="unencrypted">Disconnected</div>
<div id="log"></div>
<input id="msgInput" placeholder="Message">
<button id="sendBtn">SEND</button>

<script>
let socket = null;

function connect() {
    const ip = document.getElementById("serverIp").value;
    const mode = document.getElementById("mode").value;
    const statusDiv = document.getElementById("status");

    if (socket) socket.close();

    if (mode === "unencrypted") {
        socket = new WebSocket("ws://" + ip + ":8765");
        statusDiv.textContent = "UNENCRYPTED";
        statusDiv.className = "unencrypted";
    } else {
        socket = new WebSocket("wss://" + ip + ":8766");
        statusDiv.textContent = "ENCRYPTED";
        statusDiv.className = "encrypted";
    }

    socket.onopen = () => {
        statusDiv.textContent += " - Connected";
    };

    socket.onmessage = (event) => {
        appendLog(event.data);
    };

    socket.onclose = () => {
        statusDiv.textContent += " - Disconnected";
    };
}

function appendLog(text) {
    const log = document.getElementById("log");
    const line = document.createElement("div");
    line.textContent = text;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
}

function sendMessage() {
    const input = document.getElementById("msgInput");
    const name = document.getElementById("username").value;
    if (socket && socket.readyState === WebSocket.OPEN && input.value) {
        const text = name + ": " + input.value;
        socket.send(text);
        appendLog(text);
        input.value = "";
    }
}

document.getElementById("connectBtn").addEventListener("click", connect);
document.getElementById("sendBtn").addEventListener("click", sendMessage);
document.getElementById("msgInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
});
</script>
</body>
</html>
